# Grafana dashboard provisioning descriptor. Grafana picks up any
# JSON in this directory and auto-imports it on startup.
apiVersion: 1

providers:
  - name: infraguard
    orgId: 1
    folder: InfraGuard
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
