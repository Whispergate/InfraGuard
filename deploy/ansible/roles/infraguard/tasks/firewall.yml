---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

- name: Set default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny
  become: true

- name: Set default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow
  become: true

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ infraguard_ssh_allowed_cidrs }}"
  become: true

- name: Allow HTTPS (443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  become: true

- name: Allow HTTP (80)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  become: true

- name: Allow dashboard access
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ infraguard_dashboard_allowed_cidrs }}"
  become: true
  when: infraguard_dashboard_allowed_cidrs | length > 0

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true
