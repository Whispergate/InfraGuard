{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infraguard.fullname" . }}-secrets
  labels: {{- include "infraguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.data }}
    {{- range $key, $val := .Values.secrets.data }}
  {{ $key }}: {{ $val | quote }}
    {{- end }}
  {{- else }}
  # Provide values via ``secrets.data`` in values.yaml, or bind an
  # existing secret via ``secrets.existingSecrets``.
  INFRAGUARD_API_TOKEN: "changeme-please"
  {{- end }}
{{- end }}
