[project]
name = "infraguard"
version = "0.4.3"
description = "Red team infrastructure tracker and redirector"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-2-Clause"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "tenacity>=9.0",
    "starlette>=0.36",
    "uvicorn[standard]>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=42.0",
    "prometheus-client>=0.24.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
tui = ["textual>=0.47"]
geoip = ["maxminddb>=2.5"]
dns-listener = ["dnspython>=2.6"]
mqtt-listener = ["aiomqtt>=2.0"]
http2 = ["h2>=4.0"]
redis = ["redis>=5.0"]
pdf = ["weasyprint>=60.0", "fpdf2>=2.7"]
all = ["infraguard[tui,geoip,dns-listener,mqtt-listener,http2,redis,pdf]"]

[project.scripts]
infraguard = "infraguard.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infraguard"]
