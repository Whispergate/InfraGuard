listeners:
- bind: 0.0.0.0
  port: 443
  tls:
    cert: ${INFRAGUARD_TLS_CERT}
    key: ${INFRAGUARD_TLS_KEY}
  domains:
  - ${INFRAGUARD_DOMAIN}
- bind: 0.0.0.0
  port: 80
  domains:
  - ${INFRAGUARD_DOMAIN}
domains:
  ${INFRAGUARD_DOMAIN}:
    upstream: ${INFRAGUARD_MYTHIC_UPSTREAM}
    profile_path: ../examples/jquery-c2.3.14.profile.json
    profile_type: mythic
    whitelist_cidrs: []
    drop_action:
      type: decoy
      target: ${IG_DECOY_SITE}
    content_routes:
    - path: /jquery-3.7.1.min.js
      backend:
        type: mythic_file
        target: ${MYTHIC_URL}
        file_id: ${MYTHIC_STAGE2_FILE_ID}
        ssl_verify: false
        headers:
          Content-Disposition: attachment; filename="jquery-3.7.1.min.js"
      guard:
        require_beacon_ip: true
        allowed_user_agents:
        - ^Mozilla/5\.0 \(Windows NT
        - WinHTTP
        forbidden_headers:
        - Via
        - X-Forwarded-For
      require_token: true
      rate_limit:
        enabled: true
        max_downloads: 1
        window_seconds: 3600
      conditional:
        score_threshold: 0.5
        scanner_backend:
          type: http_proxy
          target: https://jquery.com
      track: true
    - path: /dl/*
      backend:
        type: mythic_file
        target: ${MYTHIC_URL}
        ssl_verify: false
      guard:
        require_beacon_ip: true
        forbidden_headers:
        - Via
        - X-Forwarded-For
      rate_limit:
        enabled: true
        max_downloads: 5
        window_seconds: 300
      track: true
    - path: /downloads/*
      backend:
        type: pwndrop
        target: http://pwndrop:80
        auth_token: ${PWNDROP_TOKEN}
      rate_limit:
        enabled: true
        max_downloads: 3
        window_seconds: 300
      conditional:
        score_threshold: 0.5
        scanner_backend:
          type: http_proxy
          target: https://jquery.com
      track: true
intel:
  auto_block_scanners: true
  dynamic_whitelist_threshold: 3
  geoip_db: ${INFRAGUARD_GEOIP_DB}
  geoip_asn_db: ${INFRAGUARD_GEOIP_ASN_DB}
  geoip_country_db: ${INFRAGUARD_GEOIP_COUNTRY_DB}
  banned_ip_file: ${INFRAGUARD_BANNED_IP_FILE}
  rules_dir: ${INFRAGUARD_RULES_DIR}
  dns_enum_nxdomain_threshold: 15
  dns_enum_window_seconds: 30
  feeds:
    enabled: true
  ct_monitor:
    enabled: false
    interval_hours: 6.0
    monitored_domains: []
  reputation_monitor:
    enabled: false
    interval_hours: 4.0
    check_urlhaus: true
    check_openphish: true
tracking:
  db_path: ${INFRAGUARD_DB_PATH}
pipeline:
  filter_mode: ${INFRAGUARD_FILTER_MODE}
  block_score_threshold: 0.7
  replay_window_seconds: 86400
  replay_persist: true
  enable_enumeration_filter: true
  enumeration_unique_path_threshold: 20
  enumeration_unique_path_suspect_threshold: 8
  enumeration_window_seconds: 60
  enable_sandbox_filter: true
  enable_ja3_filter: true
  ja3_filter:
    log_ja3: true
    block_unknown: false
    ja3_header: x-ja3
api:
  bind: 0.0.0.0
  port: 8080
  auth_token: ${INFRAGUARD_API_TOKEN}
  health_path: /${INFRAGUARD_HEALTH_PATH}
payload_tokens:
  enabled: false
  default_ttl_seconds: 3600
  default_max_uses: 1
  token_header: X-DL-Token
  token_param: _t
  issuance_header: X-Payload-Token
decoy_pages_dir: ${IG_DECOY_PAGES_DIR}
logging:
  level: ${INFRAGUARD_LOG_LEVEL}
  format: json
plugin_settings:
  example:
    enabled: false

